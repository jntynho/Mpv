name: Build Luma APKs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          # Pin Java-17-compatible command-line tools, independent of runner updates.
          curl --fail --location --silent --show-error \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/luma-sdk-tools"
          sdk="$RUNNER_TEMP/luma-sdk-tools/cmdline-tools/bin/sdkmanager"
          python3 - "$sdk" <<'PYCODE'
          import os, subprocess, sys
          command = [sys.argv[1], '--sdk_root=' + os.environ['ANDROID_HOME']]
          subprocess.run(command + ['--licenses'], input='y\n' * 100, text=True, check=True)
          subprocess.run(command + ['platforms;android-36', 'build-tools;35.0.0'], check=True)
          PYCODE
      - name: Build installable APKs and validate
        shell: bash
        run: |
          mkdir -p ci-reports
          set +e
          set -o pipefail
          bash ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug assemblePreview 2>&1 | tee ci-reports/build.log
          result=$?
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYCODE'
          import pathlib
          lines = pathlib.Path('ci-reports/build.log').read_text(errors='replace').splitlines()
          errors = [line.strip() for line in lines if line.lstrip().startswith(('e: ', '> ', 'Execution failed', 'FAILURE:', 'Gradle build daemon')) and not line.lstrip().startswith('> Task')]
          for line in errors[-25:]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
          fi
          exit "$result"
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Luma-validation-reports
          path: |
            ci-reports/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
      - name: Check both native architectures and APK signatures
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a; do
            apk="app/build/outputs/apk/preview/app-${abi}-preview.apk"
            test -s "$apk"
            unzip -Z1 "$apk" | grep "^lib/${abi}/.*\.so$" > /dev/null
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          done
          cd app/build/outputs/apk/preview
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Luma-arm64-64bit
          path: app/build/outputs/apk/preview/app-arm64-v8a-preview.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Luma-armv7-32bit
          path: app/build/outputs/apk/preview/app-armeabi-v7a-preview.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Luma-universal-and-checksums
          path: |
            app/build/outputs/apk/preview/app-universal-preview.apk
            app/build/outputs/apk/preview/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Luma-*
          path: artifacts
      - name: Publish direct APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          cp artifacts/Luma-arm64-64bit/app-arm64-v8a-preview.apk release-assets/Luma-Player-arm64-v8a.apk
          cp artifacts/Luma-armv7-32bit/app-armeabi-v7a-preview.apk release-assets/Luma-Player-armeabi-v7a.apk
          cp artifacts/Luma-universal-and-checksums/app-universal-preview.apk release-assets/Luma-Player-universal.apk
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
          cat > release-notes.md <<'NOTES'
          Download an APK below directly; no ZIP extraction is needed.

          - arm64-v8a: Android ARM 64-bit
          - armeabi-v7a: Android ARM 32-bit
          - universal: all included architectures

          These APKs use automatic test signing, not a permanent production signing identity.
          Updates across builds may require uninstalling the previous version.
          No user-configured Secrets are required; publication uses GitHub's automatic workflow token.
          NOTES
          gh release create "$RELEASE_TAG" release-assets/*.apk release-assets/SHA256SUMS.txt \
            --verify-tag --title "Luma Player $RELEASE_TAG" --notes-file release-notes.md
