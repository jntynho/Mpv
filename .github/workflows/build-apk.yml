name: Build MPV APKs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          # Pin Java-17-compatible command-line tools, independent of runner updates.
          curl --fail --location --silent --show-error \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/luma-sdk-tools"
          sdk="$RUNNER_TEMP/luma-sdk-tools/cmdline-tools/bin/sdkmanager"
          python3 - "$sdk" <<'PYCODE'
          import os, subprocess, sys
          command = [sys.argv[1], '--sdk_root=' + os.environ['ANDROID_HOME']]
          subprocess.run(command + ['--licenses'], input='y\n' * 100, text=True, check=True)
          subprocess.run(command + ['platforms;android-36', 'build-tools;35.0.0', 'ndk;27.0.12077973'], check=True)
          PYCODE
      - name: Validate icon catalogue and unchanged home folder
        run: python3 scripts/check-icon-assets.py
      - name: Build installable APKs and validate
        shell: bash
        run: |
          mkdir -p ci-reports
          set +e
          set -o pipefail
          bash ./gradlew --no-daemon --max-workers=1 testDebugUnitTest lintDebug assemblePreview 2>&1 | tee ci-reports/build.log
          result=$?
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYCODE'
          import pathlib
          lines = pathlib.Path('ci-reports/build.log').read_text(errors='replace').splitlines()
          errors = [line.strip() for line in lines if line.lstrip().startswith(('e: ', '> ', 'Execution failed', 'FAILURE:', 'Gradle build daemon')) and not line.lstrip().startswith('> Task')]
          for line in errors[-25:]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
          fi
          exit "$result"
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MPV-validation-reports
          path: |
            ci-reports/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/mapping/preview/usage.txt
            app/build/outputs/mapping/preview/resources.txt
          if-no-files-found: warn
      - name: Check both native architectures and APK signatures
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a; do
            apk="app/build/outputs/apk/preview/app-${abi}-preview.apk"
            test -s "$apk"
            unzip -Z1 "$apk" | grep "^lib/${abi}/.*\.so$" > /dev/null
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          done
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/preview/app-universal-preview.apk
          for apk in app/build/outputs/apk/preview/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: MPV-APK-arm64
          path: app/build/outputs/apk/preview/app-arm64-v8a-preview.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MPV-APK-arm32
          path: app/build/outputs/apk/preview/app-armeabi-v7a-preview.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MPV-APK-universal
          path: app/build/outputs/apk/preview/app-universal-preview.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MPV-APK-*
          path: artifacts
      - name: Publish direct APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          cp artifacts/MPV-APK-arm64/app-arm64-v8a-preview.apk release-assets/arm64-v8a.apk
          cp artifacts/MPV-APK-arm32/app-armeabi-v7a-preview.apk release-assets/armeabi-v7a.apk
          cp artifacts/MPV-APK-universal/app-universal-preview.apk release-assets/universal.apk
          cat > release-notes.md <<'NOTES'
          Download an APK below directly; no ZIP extraction is needed.

          - arm64-v8a: Android ARM 64-bit
          - armeabi-v7a: Android ARM 32-bit
          - universal: all included architectures

          These APKs use automatic test signing, not a permanent production signing identity.
          Updates across builds may require uninstalling the previous version.
          No user-configured Secrets are required; publication uses GitHub's automatic workflow token.
          NOTES
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.apk --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.apk \
              --verify-tag --title "MPV $RELEASE_TAG" --notes-file release-notes.md
          fi
          # Fail if publication is incomplete or an unexpected asset is attached.
          gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | sort' > published-assets.json
          python3 - <<'PYCODE'
          import json
          with open('published-assets.json') as source:
              assert json.load(source) == ['arm64-v8a.apk', 'armeabi-v7a.apk', 'universal.apk']
          PYCODE
